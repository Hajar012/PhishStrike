<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PhishStrike</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <header>
        <button id="languageButton" type="button">
            العربية
        </button>
    </header>

    <main>

        <h1 id="title">PhishStrike</h1>

        <p id="subtitle">
            Fighting Email Attacks
        </p>

        <form id="emailForm">

            <label id="emailLabel" for="email">
                Enter your email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="example@email.com"
                maxlength="254"
                autocomplete="off"
                required
            >

            <button id="checkButton" type="submit">
                Check Email
            </button>

        </form>

        <div id="message" role="alert"></div>

    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
