<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PhishStrike{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- PhishStrike CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body data-page="{% block page_key %}index{% endblock %}">

    <!-- Animated background -->
    <div class="background-grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Top bar with navigation -->
    <header class="topbar">
        <div class="brand">
            <img
                src="{{ url_for('static', filename='img/logoPhishStrike-noText-transparent.png') }}"
                alt=""
                class="brand-logo"
            >
            <a href="{{ url_for('main.home') }}" class="brand-link">
                PHISH<span class="brand-accent">STRIKE</span>
            </a>
        </div>

        <nav class="main-nav">
            <a href="{{ url_for('main.home') }}" class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}" data-i18n="nav.email">
                Email Scanner
            </a>
            <a href="{{ url_for('main.phishing_analyzer') }}" class="nav-link {% if request.endpoint == 'main.phishing_analyzer' %}active{% endif %}" data-i18n="nav.phishing">
                Phishing Analyzer
            </a>
            <a href="{{ url_for('main.url_checker') }}" class="nav-link {% if request.endpoint == 'main.url_checker' %}active{% endif %}" data-i18n="nav.url">
                URL Checker
            </a>
            <a href="{{ url_for('main.quiz') }}" class="nav-link {% if request.endpoint == 'main.quiz' %}active{% endif %}" data-i18n="nav.quiz">
                Security Quiz
            </a>
        </nav>

        <div class="topbar-controls">
            <button id="soundButton" class="language-button sound-button" type="button" aria-pressed="true">
                SOUND ON
            </button>
            <button id="languageButton" class="language-button" type="button">
                العربية
            </button>
        </div>
    </header>

    <main class="main-container">
        <!-- System status -->
        <div class="system-status">
            <span class="status-dot"></span>
            <span data-i18n="status.online">SYSTEM ONLINE</span>
            <span class="status-divider">/</span>
            <span data-i18n="status.@page">{% block system_status %}SECURITY TOOLS{% endblock %}</span>
        </div>

        {% block content %}{% endblock %}

    </main>

    <footer>
        <span>PHISHSTRIKE</span>
        <span data-i18n="footer.@page">{% block footer_text %}EMAIL SECURITY TOOL{% endblock %}</span>
        <span>2026</span>
    </footer>

    <audio id="breachSound" src="{{ url_for('static', filename='audio/beep.mp3') }}" preload="auto"></audio>

    <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
    <script src="{{ url_for('static', filename='js/sanitize.js') }}"></script>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
