<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}PhishStrike{% endblock %}</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >

    <!-- PhishStrike CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
</head>

<body>

    <!-- Animated background -->
    <div class="background-grid"></div>
    <div class="glow glow-one"></div>
    <div class="glow glow-two"></div>

    <!-- Top bar with navigation -->
    <header class="topbar">
        <div class="brand">
            <span class="brand-symbol">◈</span>
            <a href="{{ url_for('main.home') }}" class="brand-link">
                PHISH<span class="brand-accent">STRIKE</span>
            </a>
        </div>

        <nav class="main-nav">
            <a href="{{ url_for('main.home') }}" class="nav-link {% if request.endpoint == 'main.home' %}active{% endif %}">
                Email Scanner
            </a>
            <a href="{{ url_for('main.phishing_analyzer') }}" class="nav-link {% if request.endpoint == 'main.phishing_analyzer' %}active{% endif %}">
                Phishing Analyzer
            </a>
            <a href="{{ url_for('main.url_checker') }}" class="nav-link {% if request.endpoint == 'main.url_checker' %}active{% endif %}">
                URL Checker
            </a>
            <!-- Placeholder for future pages -->
            <span class="nav-link coming-soon">Security Quiz <small>(Coming Soon)</small></span>
        </nav>

        <button id="languageButton" class="language-button" type="button">
            العربية
        </button>
    </header>

    <main class="main-container">
        <!-- System status -->
        <div class="system-status">
            <span class="status-dot"></span>
            <span>SYSTEM ONLINE</span>
            <span class="status-divider">/</span>
            <span>{% block system_status %}SECURITY TOOLS{% endblock %}</span>
        </div>

        {% block content %}{% endblock %}

    </main>

    <footer>
        <span>PHISHSTRIKE</span>
        <span>{% block footer_text %}EMAIL SECURITY TOOL{% endblock %}</span>
        <span>2026</span>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}

</body>
</html>
